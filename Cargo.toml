[workspace]
resolver = "2"
members = []

[package]
name = "bevy-os"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies.bevy]
git = "https://github.com/bevyengine/bevy"
default-features = false
features = ["default_no_std"]

[dependencies.tracing]
git = "https://github.com/bushrat011899/tracing"
# See https://github.com/tokio-rs/tracing/pull/3199
branch = "portable-atomic"
default-features = false

[dependencies.tracing-subscriber]
git = "https://github.com/bushrat011899/tracing"
# See https://github.com/tokio-rs/tracing/pull/3199
branch = "portable-atomic"
default-features = false

[dependencies]
aarch64-cpu = "10.0.0"
arm-gic = "0.2.2"
bitflags = "2.9.0"
buddy_system_allocator = "0.11.0"
chrono = { version = "0.4.40", default-features = false }
critical-section = { version = "1.2.0", features = ["restore-state-bool"] }
# cortex-m = { version = "0.7.7", features = ["critical-section-single-core"]}
goblin = { version = "0.9.3", default-features = false, features = [
    "pe32",
    "pe64",
    "elf64",
    "elf32",
    "mach64",
    "mach32",
] }
log = "0.4.26"
once_cell = { version = "1.20.3", default-features = false, features = [
    "race",
] }
smccc = "0.1.1"
spin = "0.9.8"

[build-dependencies]
cc = { version = "1.2.16", features = ["parallel"] }
